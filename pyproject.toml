[project]
# Versão canônica do app: backend/version.py (APP_VERSION). Manter igual.
name = "fingerprint-manager"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

# Lint: ruff check (só bugs — F: imports/vars inutilizados, nomes
# indefinidos; E9: erros de sintaxe). Sem regras de estilo (E501 etc.)
# para não gerar churn no código existente.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
