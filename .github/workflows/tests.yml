name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (gi/GTK via dnf)
        run: dnf install -y python3 python3-gobject gtk4 libadwaita vte291-gtk4 python3-pytest ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Backend (headless; UI pula sem display)
        run: python3 -m pytest tests/ -q
